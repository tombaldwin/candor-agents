# CI gate for candor-agents. This exists because a Critical bug shipped once when the embedded-contract
# drift test was committed RED and the CLI was untested — nothing was gating `python3 test.py`. This
# workflow runs the behavioral tests (INCLUDING the embedded-contract drift gate) and the soundness
# fuzzer on every push and PR, and FAILS the build on any failure (both scripts `sys.exit(1)` on a
# failing check). No external services, no candor-query/Rust required: the candor-query parity tests
# SKIP cleanly when the binary is absent, so this gate is hermetic and fast.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the floor (pyproject requires-python >= 3.9) and a current release — catches version drift
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Behavioral tests, end to end — INCLUDES the embedded-contract drift gate (AGENTS.md vs the
      # shipped agentsmd module), the CLI/gate behaviour matrix, the in-process policy gate, and the
      # adversarial-parse coverage. A red check exits 1 and fails the job.
      - name: test.py (behavioral tests + embedded-contract drift gate)
        run: python3 test.py
      # Soundness fuzzer — the scan delegation/subtraction lanes and the observe-transcript lane (the
      # path whose unfuzzed crash shipped the bug). Exits 1 on any seed failure.
      - name: fuzz.py (soundness fuzzer)
        run: python3 fuzz.py
