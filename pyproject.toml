[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "candor-agents"
version = "0.28.0"
description = "candor for agent fleets — declared vs observed effects, transitively, with a policy gate (candor-spec 0.28)"
readme = "README.md"
license = "MIT OR Apache-2.0"
requires-python = ">=3.9"
keywords = ["agents", "effects", "static-analysis", "claude-code", "policy", "candor"]

[project.urls]
Homepage = "https://candor.poly.io"
Repository = "https://github.com/tombaldwin/candor-agents"

[project.scripts]
candor-agents = "candor_agents.cli:main"

[tool.setuptools]
packages = ["candor_agents"]
